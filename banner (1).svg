<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="240" viewBox="0 0 1000 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7eb3"/>
      <stop offset="45%" stop-color="#c471ed"/>
      <stop offset="100%" stop-color="#7b6cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="sparkle" d="M0,-14 Q0,0 14,0 Q0,0 0,14 Q0,0 -14,0 Q0,0 0,-14 Z"/>
    <path id="heart" d="M0,7 C-14,-6 -7,-16 0,-7 C7,-16 14,-6 0,7 Z"/>
  </defs>

  <rect width="1000" height="240" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="22" fill="url(#glow)"/>

  <!-- soft bubbles -->
  <circle cx="90" cy="45" r="70" fill="#ffffff" opacity="0.10"/>
  <circle cx="930" cy="200" r="95" fill="#ffffff" opacity="0.10"/>
  <circle cx="860" cy="30" r="30" fill="#ffffff" opacity="0.12"/>
  <circle cx="140" cy="210" r="26" fill="#ffffff" opacity="0.12"/>

  <!-- sparkles -->
  <use xlink:href="#sparkle" transform="translate(150,70) scale(1.4)" fill="#ffffff" opacity="0.95">
    <animate attributeName="opacity" values="0.95;0.3;0.95" dur="2.4s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#sparkle" transform="translate(850,70) scale(1.1)" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.8s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#sparkle" transform="translate(235,190) scale(0.8)" fill="#fff0f6" opacity="0.9"/>
  <use xlink:href="#sparkle" transform="translate(770,195) scale(1)" fill="#fff0f6" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="3.2s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#sparkle" transform="translate(60,130) scale(0.7)" fill="#ffffff" opacity="0.8"/>
  <use xlink:href="#sparkle" transform="translate(940,120) scale(0.7)" fill="#ffffff" opacity="0.8"/>

  <!-- hearts -->
  <use xlink:href="#heart" transform="translate(205,45) scale(0.9)" fill="#ffe3ee" opacity="0.95"/>
  <use xlink:href="#heart" transform="translate(800,170) scale(1.1)" fill="#ffe3ee" opacity="0.95"/>
  <use xlink:href="#heart" transform="translate(110,175) scale(0.7)" fill="#ffd6e8" opacity="0.9"/>

  <!-- name (with soft shadow) -->
  <text x="502" y="102" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#6a1b9a" opacity="0.35">Kashish Kewat</text>
  <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#ffffff">Kashish Kewat</text>

  <!-- role pill -->
  <rect x="270" y="122" width="460" height="42" rx="21" fill="#ffffff" opacity="0.92"/>
  <text x="500" y="151" text-anchor="middle" font-family="Georgia, 'Segoe UI', serif" font-size="22" font-style="italic" font-weight="600" fill="#9c27b0">Software Engineer  ✦  ML &amp; AI Engineer</text>

  <!-- skills line -->
  <text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="1.5" fill="#ffffff">Python  •  Django  •  Node.js  •  NLP  •  LLM APIs</text>
</svg>
