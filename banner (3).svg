<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="240" viewBox="0 0 1000 240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="50%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <path id="sparkle" d="M0,-14 Q0,0 14,0 Q0,0 0,14 Q0,0 -14,0 Q0,0 0,-14 Z"/>
  </defs>

  <rect width="1000" height="240" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="22" fill="url(#glow)"/>

  <!-- soft circles -->
  <circle cx="90" cy="45" r="70" fill="#a78bfa" opacity="0.18"/>
  <circle cx="930" cy="200" r="95" fill="#a78bfa" opacity="0.20"/>
  <circle cx="860" cy="30" r="30" fill="#ffffff" opacity="0.35"/>
  <circle cx="140" cy="210" r="26" fill="#ffffff" opacity="0.35"/>

  <!-- sparkles -->
  <use xlink:href="#sparkle" transform="translate(150,70) scale(1.4)" fill="#ffffff" opacity="1">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#sparkle" transform="translate(850,70) scale(1.1)" fill="#ffffff" opacity="1">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#sparkle" transform="translate(235,190) scale(0.8)" fill="#8b5cf6" opacity="0.8"/>
  <use xlink:href="#sparkle" transform="translate(770,195) scale(1)" fill="#8b5cf6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.2s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#sparkle" transform="translate(60,130) scale(0.7)" fill="#ffffff" opacity="0.95"/>
  <use xlink:href="#sparkle" transform="translate(940,120) scale(0.7)" fill="#ffffff" opacity="0.95"/>

  <!-- name (with soft shadow) -->
  <text x="502" y="97" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#ffffff" opacity="0.7">Kashish Kewat</text>
  <text x="500" y="95" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#4c1d95">Kashish Kewat</text>

  <!-- main role pill -->
  <rect x="240" y="118" width="520" height="44" rx="22" fill="#5b21b6"/>
  <text x="500" y="148" text-anchor="middle" font-family="Georgia, 'Segoe UI', serif" font-size="23" font-style="italic" font-weight="600" fill="#ffffff">Software Engineer  ✦  Python Developer</text>

  <!-- other roles -->
  <text x="500" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="1" font-weight="600" fill="#5b21b6">AI / ML Developer  •  Data Analytics  •  Data Science</text>
</svg>
